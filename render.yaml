# ═══════════════════════════════════════════════════════════════
#  NEKTO — развёртывание в облаке (Render) БЕЗ твоего компьютера
#  Теперь сайт работает 24/7 на сервере Render, твой ПК можно выключать.
# ═══════════════════════════════════════════════════════════════

# ЧТО ТЕБЕ НУЖНО (один раз, бесплатно):
#  1. Аккаунт на GitHub  (github.com)  — чтобы загрузить код.
#  2. Аккаунт на Render  (render.com)  — «Sign up» через кнопку GitHub.
#  Карта НЕ нужна. Деньги НЕ списываются. Регистрация 1 раз.
#
# ПОШАГОВО:
#
# ШАГ 1. Залей код на GitHub (см. инструкцию в README — раздел «Загрузка на GitHub»)
#
# ШАГ 2. Зайди на https://dashboard.render.com  → New → Web Service
#        - Connect: выбери свой репозиторий (nekto)
#        - Name: nekotochat  (любое)
#        - Runtime: Python 3
#        - Build Command:  pip install -r requirements.txt
#        - Start Command:  python server.py
#        - Instance Type:  Free
#        Не меняй ничего больше. Нажми «Create Web Service».
#
# ШАГ 3. Через 3-5 минут сервис запустится. Render сам выдаст адрес:
#        https://nekotochat.onrender.com  (или похожий).
#        Готово — сайт в интернете! Раздавай ссылку друзьям.
#
# ВАЖНО ПРО БЕСПЛАТНЫЙ ТАРИФ:
#  Render «засыпает» сайт, если 15 минут никто не заходит. При заходе
#  сайт просыпается 30–60 секунд. Чтобы он НЕ засыпал, мы 2 раза в час
#  стучимся в него из отдельного БЕСПЛАТНОГО планировщика (см. ниже).
#  Даже если сайт заснул из-за долгого отсутствия людей — это не страшно,
#  он просто проснётся при первом заходе.
#
# ШАГ 4 (рекомендуется). Подними бота-пингера, чтобы сайт не засыпал:
#  Зайди на https://cron-job.org  → Sign up (бесплатно, без карты)
#  → Create Cronjob → URL твоего сайта + /healthz, например:
#      https://nekotochat.onrender.com/healthz
#  → Execute every: 30 minutes → Save.
#  Теперь каждые полчаса сервер «будит» твой сайт — он не засыпает.

# ПРИМЕЧАНИЯ:
#  * Пока код в этом репозитории и пока подписан бесплатный аккаунт —
#    всё бесплатно. Render не требует карты на бесплатном тарифе.
#  * Если захочешь, потом можно подключить свой домен (платно) или
#    переехать на Oracle Cloud (навсегда бесплатный сервер).
#  * Локально тоже всё работает: python server.py → http://localhost:8080